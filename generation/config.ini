[dds]
request_deadline=50
request_interval=100
max_interval=1000
add_sensor_interval=1000
topic_adapter_subscribe=from/adapters
topic_adapter_publish=to/adapters
domain_id=227

[mqtt]
host=mosquitto
port=1883
enable_publish=false
cam_topic=jetson/camera/tracking/objects

[mqtt-radar]
host=mosquitto
port=1883
client_id=mqtt-adapter-radar
radar_topic=jetson/radar-plus

[mqtt-camera]
host=mosquitto
port=1883
client_id=mqtt-adapter-camera
camera_topic=jetson/camera/tracking/objects

[general]
clean_object_interval=15000
topic_cpm_publish=vanetza/in/cpm
topic_cpm_subscribe=cps-v2/out/cpm,cps-v2/in/cpm
topic_objects_publish=objects
stationType=5
expected_responses=1
debug=1
latitude=0.0
longitude=0.0

[mqtt-processing]
host=mosquitto
enable_subscriber=false
enable_publisher=false

[dds-processing]
enable_subscriber=true
enable_publisher=true
