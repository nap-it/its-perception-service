version: '2.4'
services:
  camera:
    hostname: camera
    image: camera-adapter:test
    cap_add:
      - "NET_ADMIN"
    volumes:
      - ./config.ini:/config.ini
    networks:
      vanetzalan0:
        ipv4_address: 192.168.98.40

  radar:
    hostname: radar
    image: radar-adapter:test
    cap_add:
      - "NET_ADMIN"
    volumes:
      - ./config.ini:/config.ini
    networks:
      vanetzalan0:
        ipv4_address: 192.168.98.41

networks:
  vanetzalan0:
    external: true