version: '2.4'
services:
  camera:
    hostname: camera
    image: code.nap.av.it.pt:5050/mobility-networks/cps-v2/camera-adapter:latest
    cap_add:
      - "NET_ADMIN"
    volumes:
      - ./config.ini:/config.ini
    networks:
      vanetzalan0:
        ipv4_address: 192.168.98.40

networks:
  vanetzalan0:
    external: true