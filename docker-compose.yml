version: '2.4'
services:
  cpm-generation:
    image: code.nap.av.it.pt:5050/mobility-networks/cps-v2/generation:dcc
    restart: always
    volumes:
      - ./generation/config.ini:/config.ini
    networks:
      deploymentslan:

  cpm-processing:
    image: code.nap.av.it.pt:5050/mobility-networks/cps-v2/cpm-processing:latest
    restart: always
    volumes:
      - ./processing/config.ini:/config.ini
    networks:
      deploymentslan:

  radar-adapter:
    image: code.nap.av.it.pt:5050/mobility-networks/cps-v2/radar-adapter:dcc
    restart: always
    volumes:
      - ./radar-adapter/config.ini:/config.ini
    networks:
      deploymentslan:

  camera-adapter:
    image: code.nap.av.it.pt:5050/mobility-networks/cps-v2/camera-adapter:dcc
    restart: always
    volumes:
      - ./camera-adapter/config.ini:/config.ini
    networks:
      deploymentslan:

networks:
  deploymentslan:
    external: true
