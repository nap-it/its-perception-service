# ------------------------------------------------------------------------------
# Global variables & stages
# ------------------------------------------------------------------------------
variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"

stages:
  - build
  - manifest
  - release
  - clean

# ------------------------------------------------------------------------------
# Compute DOCKER_TAG: use the tag if set (and not "latest"), else branch name
# ------------------------------------------------------------------------------
before_script:
  - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" != "latest" ]]; then
        DOCKER_TAG="$CI_COMMIT_TAG"
      else
        DOCKER_TAG="$CI_COMMIT_BRANCH"
      fi
      echo "→ DOCKER_TAG=$DOCKER_TAG"

# ------------------------------------------------------------------------------
# 1) BUILD TEMPLATE
# ------------------------------------------------------------------------------
.default_build: &default_build
  stage: build
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" != "latest" ]]; then
        # Fetch tags so we can describe
        git fetch --no-tags --depth=1 origin "refs/tags/${CI_COMMIT_TAG}^:refs/tags/${CI_COMMIT_TAG}^"
        PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^")
        echo "→ Comparing ${DOCKERFILE_PATH} changes since $PREV_TAG…"

        CHANGED=$(git diff --name-only "$PREV_TAG" "$CI_COMMIT_TAG" -- "$DOCKERFILE_PATH")
        if [[ -z "$CHANGED" ]]; then
          echo "→ No changes in ${DOCKERFILE_PATH} since $PREV_TAG; skipping build."
          exit 0
        fi
      fi

    - echo "→ Logging in to Docker registry"
    - echo "$CI_TOKEN" | docker login -u "$CI_USER" --password-stdin code.nap.av.it.pt:5050

    - |
      echo "→ Building ${IMAGE_NAME}:${DOCKER_TAG}-${ARCH}"
      docker build \
        --build-arg VERSION="$DOCKER_TAG" \
        --build-arg COMMIT="$CI_COMMIT_SHORT_SHA" \
        -t code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-${ARCH} \
        -f ${DOCKERFILE_PATH}/Dockerfile \
        ${DOCKERFILE_PATH}

    - |
      echo "→ Pushing ${IMAGE_NAME}:${DOCKER_TAG}-${ARCH}"
      docker push code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-${ARCH}

  rules:
    # 1) Tag pipelines (except tag "latest")
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'
      changes:
        - $DOCKERFILE_PATH/**

    # 2) Non-main branch pipelines
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        - $DOCKERFILE_PATH/**

# ------------------------------------------------------------------------------
# 2) BUILD JOBS (one per component × arch)
# ------------------------------------------------------------------------------
build_generation_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: generation, DOCKERFILE_PATH: generation, ARCH: amd64 }
  tags: [amd64]

build_generation_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: generation, DOCKERFILE_PATH: generation, ARCH: arm64 }
  tags: [arm64]

build_processing_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: processing, DOCKERFILE_PATH: processing, ARCH: amd64 }
  tags: [amd64]

build_processing_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: processing, DOCKERFILE_PATH: processing, ARCH: arm64 }
  tags: [arm64]

build_autoware_adapter_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: autoware-adapter, DOCKERFILE_PATH: sensor-adapters/autoware-adapter, ARCH: amd64 }
  tags: [amd64]

build_autoware_adapter_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: autoware-adapter, DOCKERFILE_PATH: sensor-adapters/autoware-adapter, ARCH: arm64 }
  tags: [arm64]

build_bike_adapter_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: bike-adapter, DOCKERFILE_PATH: sensor-adapters/bike-adapter, ARCH: amd64 }
  tags: [amd64]

build_bike_adapter_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: bike-adapter, DOCKERFILE_PATH: sensor-adapters/bike-adapter, ARCH: arm64 }
  tags: [arm64]

build_camera_adapter_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: camera-adapter, DOCKERFILE_PATH: sensor-adapters/camera-adapter, ARCH: amd64 }
  tags: [amd64]

build_camera_adapter_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: camera-adapter, DOCKERFILE_PATH: sensor-adapters/camera-adapter, ARCH: arm64 }
  tags: [arm64]

build_radar_adapter_amd64:
  <<: *default_build
  variables: { IMAGE_NAME: radar-adapter, DOCKERFILE_PATH: sensor-adapters/radar-adapter, ARCH: amd64 }
  tags: [amd64]

build_radar_adapter_arm64:
  <<: *default_build
  variables: { IMAGE_NAME: radar-adapter, DOCKERFILE_PATH: sensor-adapters/radar-adapter, ARCH: arm64 }
  tags: [arm64]

# ------------------------------------------------------------------------------
# 3) MANIFEST TEMPLATE
# ------------------------------------------------------------------------------
.create_manifest: &create_manifest
  stage: manifest
  image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/docker
  script:
    - echo "→ Logging in for manifest"
    - echo "$CI_TOKEN" | docker login -u "$CI_USER" --password-stdin code.nap.av.it.pt:5050
    - |
      echo "→ Manifest ${IMAGE_NAME}:${DOCKER_TAG}"
      docker manifest create code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG} \
        code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-amd64 \
        code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-arm64
      docker manifest annotate code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG} \
        code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-amd64 --arch amd64
      docker manifest annotate code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG} \
        code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-arm64 --arch arm64
      docker manifest push code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}

      # Only on tag pipelines, also bump :latest
      if [[ -n "$CI_COMMIT_TAG" && "$CI_COMMIT_TAG" != "latest" ]]; then
        echo "→ Manifest ${IMAGE_NAME}:latest"
        docker manifest create code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:latest \
          code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-amd64 \
          code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-arm64
        docker manifest annotate code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:latest \
          code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-amd64 --arch amd64
        docker manifest annotate code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:latest \
          code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:${DOCKER_TAG}-arm64 --arch arm64
        docker manifest push code.nap.av.it.pt:5050/mobility-networks/cps-v2/${IMAGE_NAME}:latest
      fi

  rules:
    # Tag pipelines only
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'
      changes:
        - $DOCKERFILE_PATH/**

    # Non-main branch pipelines
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        - $DOCKERFILE_PATH/**

# ------------------------------------------------------------------------------
# 4) MANIFEST JOBS (one per component)
# ------------------------------------------------------------------------------
create_manifest_generation:
  <<: *create_manifest
  variables: { IMAGE_NAME: generation, DOCKERFILE_PATH: generation }
  dependencies: [build_generation_amd64, build_generation_arm64]
  tags: [amd64]

create_manifest_processing:
  <<: *create_manifest
  variables: { IMAGE_NAME: processing, DOCKERFILE_PATH: processing }
  dependencies: [build_processing_amd64, build_processing_arm64]
  tags: [amd64]

create_manifest_autoware_adapter:
  <<: *create_manifest
  variables: { IMAGE_NAME: autoware-adapter, DOCKERFILE_PATH: sensor-adapters/autoware-adapter }
  dependencies: [build_autoware_adapter_amd64, build_autoware_adapter_arm64]
  tags: [amd64]

create_manifest_bike_adapter:
  <<: *create_manifest
  variables: { IMAGE_NAME: bike-adapter, DOCKERFILE_PATH: sensor-adapters/bike-adapter }
  dependencies: [build_bike_adapter_amd64, build_bike_adapter_arm64]
  tags: [amd64]

create_manifest_camera_adapter:
  <<: *create_manifest
  variables: { IMAGE_NAME: camera-adapter, DOCKERFILE_PATH: sensor-adapters/camera-adapter }
  dependencies: [build_camera_adapter_amd64, build_camera_adapter_arm64]
  tags: [amd64]

create_manifest_radar_adapter:
  <<: *create_manifest
  variables: { IMAGE_NAME: radar-adapter, DOCKERFILE_PATH: sensor-adapters/radar-adapter }
  dependencies: [build_radar_adapter_amd64, build_radar_adapter_arm64]
  tags: [amd64]

# ------------------------------------------------------------------------------
# 5) RELEASE (GitLab Releases) on Tag pipelines only
# ------------------------------------------------------------------------------
release:
  stage: release
  image: curlimages/curl:latest
  tags: [amd64]
  before_script:
    - curl --location --output ~/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - chmod +x ~/release-cli
  script:
    - echo "→ Creating GitLab Release for $CI_COMMIT_TAG"
    - ~/release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --description "Multi-image release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --ref "$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'

# ------------------------------------------------------------------------------
# 6) CLEANUP (remove all -amd64 / -arm64 tags) on tags & non-main branches
# ------------------------------------------------------------------------------
cleanup:
  stage: clean
  image: alpine:latest
  tags: [amd64]
  script:
    - apk add --no-cache curl bash
    - curl -LO https://github.com/regclient/regclient/releases/download/v0.6.1/regctl-linux-amd64
    - chmod +x regctl-linux-amd64 && mv regctl-linux-amd64 /usr/local/bin/regctl
    - regctl registry login code.nap.av.it.pt:5050 -u "${CI_USER}" -p "${CI_TOKEN}"
    - echo "→ Cleaning up tags for $CI_COMMIT_TAG or non-main branch $CI_COMMIT_BRANCH"
    - |
      for IMAGE in generation processing autoware-adapter bike-adapter camera-adapter radar-adapter; do
        echo "→ Cleaning up $IMAGE"
        regctl tag rm code.nap.av.it.pt:5050/mobility-networks/cps-v2/$IMAGE:${DOCKER_TAG}-amd64 || true
        regctl tag rm code.nap.av.it.pt:5050/mobility-networks/cps-v2/$IMAGE:${DOCKER_TAG}-arm64 || true
        regctl tag rm code.nap.av.it.pt:5050/mobility-networks/cps-v2/$IMAGE:latest-amd64 || true
        regctl tag rm code.nap.av.it.pt:5050/mobility-networks/cps-v2/$IMAGE:latest-arm64 || true
      done

  rules:
    # Tag pipelines only
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"'

    # Non-main branch pipelines
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'