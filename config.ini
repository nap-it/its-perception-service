[radar-adapter]
mqtt_host=mosquitto
mqtt_port=1883
mqtt_topic=jetson/radar-plus
mqtt_client_id=radar-adapter
clean_last_sent_interval=5000
max_object_age=15000
domain_id=0
debug=0

[camera-adapter]
mqtt_host=mosquitto
mqtt_port=1883
mqtt_topic=jetson/camera/tracking/objects
mqtt_client_id=camera-adapter
clean_last_sent_interval=5000
max_object_age=15000
domain_id=0
debug=0

[cpm-generation]
debug=0
domain_id=0
station_type=15
expected_responses=2
latitude = 40.630280
longitude = -8.654225
subscribe_cam_topic=vanetza/in/cam_full
subscribe_adapter_topic=from/adapters
publish_adapter_topic=to/adapters
publish_cpm_topic=cps-v2/in/cpm
request_deadline=50
request_interval=100
max_interval=1000
add_sensor_interval=1000
clean_object_interval=15000
mqtt_enable_publish=false
mqtt_host=mosquitto
mqtt_port=1883
mqtt_publish_cpm_topic=cps-v2/in/cpm

[cpm-processing]
debug=0
domain_id=0
subscribe_cpm_topic=cps-v2/in/cpm
dds_publish_objects_topic=objects                               ; empty to disable
dds_publish_objects_full_topic=objects_full                     ; empty to disable
local_mqtt_enable_publisher=true
local_mqtt_host=mosquitto
local_mqtt_port=1883
local_mqtt_publish_objects_topic=objects                        ; empty to disable
local_mqtt_publish_objects_full_topic=objects_full              ; empty to disable
remote_mqtt_enable_publisher=false
remote_mqtt_host=atcll-services.nap.av.it.pt
remote_mqtt_port=1884
remote_mqtt_username=atcll-services
remote_mqtt_password=password
remote_mqtt_publish_objects_topic=p0/objects                     ; empty to disable
remote_mqtt_publish_objects_full_topic=p0/objects_full           ; empty to disable
repeat_id_interval=3600
