[dds]
request_deadline=50
request_interval=100
max_interval=1000
add_sensor_interval=1000
topic_adapter_subscribe=from/adapters
topic_adapter_publish=to/adapters
domain_id=35

[mqtt]
host=localhost
port=1883
client_id=mqtt-adapter
qos = 1
n_retry_attempts=5
enable_publish=false
camera_topic=jetson/camera/tracking/objects
radar_topic=jetson/radar-plus

[general]
clean_object_interval=15000
expected_responses=2
topic_cpm_publish=vanetza/in/cpm
topic_cpm_subscribe=vanetza/out/cpm, vanetza/in/cpm
topic_objects_publish=objects

[mqtt-processing]
host=localhost
enable_subscriber=false
enable_publisher=true

[dds-processing]
enable_subscriber=true
enable_publisher=true
