domain_id=0
subscribe_cpm_topic=cps-v2/in/cpm
dds_publish_objects_topic=objects                               ; empty to disable
dds_publish_objects_full_topic=objects_full                     ; empty to disable
local_mqtt_enable_publisher=true
local_mqtt_host=mosquitto
