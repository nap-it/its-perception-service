---
# tasks file for cps role

- name: "Clean up /services/cps if requested"
  when: clean_up | bool
  ansible.builtin.file:
    path: /services/cps
    state: absent

- name: "Create /services/cps"
  ansible.builtin.file:
    path: /services/cps
    state: directory
    mode: "0775"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: "Get id"
  when: id is not defined
  block:
    - name: Fetch ini file
      ansible.builtin.fetch:
        src: /services/info.ini
        dest: /tmp/

    - name: Set id variable
      ansible.builtin.set_fact:
        id: "{{ lookup('ansible.builtin.ini', 'id', section='general', file='/tmp/' ~ inventory_hostname ~ '/services/info.ini') }}"

- name: "Get station_type"
  when: station_type is not defined
  block:
    - name: Fetch ini file
      ansible.builtin.fetch:
        src: /services/info.ini
        dest: /tmp/

    - name: Set station_type variable
      ansible.builtin.set_fact:
        station_type: "{{ lookup('ansible.builtin.ini', 'stationType', section='mobility', file='/tmp/' ~ inventory_hostname ~ '/services/info.ini') }}"

- name: "Get latitude"
  when: locator_latitude is not defined
  block:
    - name: Fetch ini file
      ansible.builtin.fetch:
        src: /services/info.ini
        dest: /tmp/

    - name: Set locator_latitude variable
      ansible.builtin.set_fact:
        locator_latitude: "{{ lookup('ansible.builtin.ini', 'latitude', section='mobility', file='/tmp/' ~ inventory_hostname ~ '/services/info.ini') }}"

- name: "Get longitude"
  when: locator_longitude is not defined
  block:
    - name: Fetch ini file
      ansible.builtin.fetch:
        src: /services/info.ini
        dest: /tmp/

    - name: Set locator_longitude variable
      ansible.builtin.set_fact:
        locator_longitude: "{{ lookup('ansible.builtin.ini', 'longitude', section='mobility', file='/tmp/' ~ inventory_hostname ~ '/services/info.ini') }}"

- name: “Show CPS lookup vars”
  ansible.builtin.debug:
    msg:
      - "id               = {{ id | default('undefined') }}"
      - "station_type     = {{ station_type | default('undefined') }}"
      - "locator_latitude = {{ locator_latitude | default('undefined') }}"
      - "locator_longitude= {{ locator_longitude | default('undefined') }}"

- name: Merge host's cps_overrides into defaults
  ansible.builtin.set_fact:
    cps_configs: "{{ cps_configs | combine(cps_overrides, recursive=True) }}"
  when: cps_overrides is defined

- name: "Generate unique service names"
  ansible.builtin.set_fact:
    unique_services: >-
      {%- set counts = {} -%}
      {%- set result = [] -%}
      {%- for svc in generic_services -%}
        {%- set cnt = counts.get(svc, 0) + 1 -%}
        {%- set _ = counts.update({svc: cnt}) -%}
        {%- if cnt == 1 -%}
          {%- set _ = result.append(svc) -%}
        {%- else -%}
          {%- set _ = result.append(svc + cnt|string) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Debug unique_services
  ansible.builtin.debug:
    var: unique_services

- name: "Create one folder per service under /services/cps/"
  ansible.builtin.file:
    path: "/services/cps/{{ item }}"
    state: directory
    mode: "0775"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ unique_services }}"
  loop_control:
    loop_var: item

- name: "Set per-service variables before templating configs"
  ansible.builtin.set_fact:
    real_configs: >-
      {%- set ns = namespace(cam=1, rad=1, out={}) -%}
      {%- for svc_name in unique_services -%}
        {# strip trailing digits to get the base #}
        {%- set base = svc_name | regex_replace('\\d+$', '') -%}
        {%- set cfg = cps_configs[base] | default({}) | combine({}) -%}

        {# for camera-adapter, inject numbered topic and bump cam counter #}
        {%- if base == 'camera-adapter' -%}
          {%- set derived = camera_adapter_mqtt_topic_base ~ '/' ~ ns.cam|string ~ '/tracking/objects' -%}
          {%- set cfg = cfg | combine({'mqtt_topic': derived}) -%}
          {%- set ns.cam = ns.cam + 1 -%}

        {# for radar-adapter, inject its topic and bump rad counter #}
        {%- elif base == 'radar-adapter' -%}
          {%- set cfg = cfg | combine({'mqtt_topic': radar_adapter_mqtt_topic}) -%}
          {%- set ns.rad = ns.rad + 1 -%}
        {%- endif -%}

        {# stash it under the real service name #}
        {%- set ns.out = ns.out | combine({ (svc_name): cfg }) -%}
      {%- endfor -%}
      {{ ns.out }}

- name: Render config.ini for each unique service
  ansible.builtin.template:
    src: >-
      {%- if svc.startswith('generation') -%}
        config-generation.ini.j2
      {%- elif svc.startswith('processing') -%}
        config-processing.ini.j2
      {%- elif svc.startswith('camera-adapter') -%}
        config-camera-adapter.ini.j2
      {%- elif svc.startswith('radar-adapter') -%}
        config-radar-adapter.ini.j2
      {%- elif svc.startswith('bike-adapter') -%}
        config-bike-adapter.ini.j2
      {%- elif svc.startswith('autoware-adapter') -%}
        config-autoware-adapter.ini.j2
      {%- else -%}
        {{ fail("Unknown service type: " ~ svc) }}
      {%- endif -%}
    dest: "/services/cps/{{ svc }}/config.ini"
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  vars:
    this_cfg: "{{ real_configs[svc] }}"
  loop: "{{ unique_services }}"
  loop_control:
    loop_var: svc

- name: "Render docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /services/cps/docker-compose.yml
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    

- name: "Log into private Docker registry"
  community.docker.docker_login:
    registry_url: "{{ docker_registry.split('/')[0] }}"
    username: file_api
    password: "{{ cps_token_v2 }}"

- name: "Pull all required images"
  community.docker.docker_image:
    name: "{{ docker_registry }}/{{ item }}:{{ image_tag }}"
    source: pull
    force_source: yes
  loop: "{{ generic_services }}"
  loop_control:
    loop_var: item

- name: "Stop any existing CPS Compose stack"
  community.docker.docker_compose_v2:
    project_src: /services/cps
    state: absent

- name: "Start CPS Compose stack"
  community.docker.docker_compose_v2:
    project_src: /services/cps
    state: present